<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover opts into the full screen on notched devices; every
         edge is then paid back with env(safe-area-inset-*) in the CSS.
         user-scalable is deliberately left alone: Safari ignores it since iOS 10
         and disabling zoom fails WCAG 1.4.4. Double-tap zoom is handled per
         element with touch-action: manipulation instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Deutsche Logikrätsel als druckfertiges Heft – mit Hinweisen, Logikgitter und geprüften Lösungen." />

    <title>Logicals – Rätselhefte erstellen</title>

    <!-- Home Screen web app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Logicals" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
    <link rel="stylesheet" href="./styles/play.css" />
</head>
<body>
<main id="app">
    <!-- 1. Startbildschirm -->
    <section class="screen screen--start is-active" id="screen-start">
        <div class="start-card">
            <p class="start-kicker">Deutsche Logikrätsel</p>
            <h1 class="start-title">LOGICALS</h1>
            <p class="start-sub">Rätselheft mit Hinweisen, Logikgitter und automatisch geprüften Lösungen – als druckfertiges PDF.</p>
            <button class="btn btn--primary btn--large" id="start-button" type="button">Erstellen</button>
        </div>
    </section>

    <!-- 2. Einstellungen -->
    <section class="screen screen--config" id="screen-config">
        <header class="bar">
            <button class="btn btn--ghost" type="button" data-goto="screen-start">← Zurück</button>
            <h2>Einstellungen</h2>
        </header>

        <form id="config-form" class="form">
            <fieldset class="group">
                <legend>Rätsel</legend>
                <label class="field">
                    <span>Anzahl der Rätsel</span>
                    <select name="puzzleCount" id="field-puzzleCount"></select>
                </label>
                <label class="field">
                    <span>Anzahl Kategorien</span>
                    <select name="categoryCount" id="field-categoryCount"></select>
                </label>
                <label class="field">
                    <span>Werte pro Kategorie</span>
                    <select name="valuesPerCategory" id="field-valuesPerCategory"></select>
                </label>
                <label class="field">
                    <span>Theme</span>
                    <select name="themeId" id="field-themeId"></select>
                </label>
                <label class="field">
                    <span>Schwierigkeit</span>
                    <select name="difficulty" id="field-difficulty">
                        <option value="leicht">leicht</option>
                        <option value="mittel">mittel</option>
                        <option value="schwer" selected>schwer</option>
                    </select>
                </label>
                <label class="field">
                    <span>Zielfrage</span>
                    <select name="targetCategoryIndex" id="field-targetCategoryIndex"></select>
                    <small>Auf welche Kategorie die Schlussfrage zielt.</small>
                </label>
                <label class="field">
                    <span>Seed</span>
                    <span class="field-row">
                        <input type="number" name="seed" id="field-seed" min="0" step="1" value="100" inputmode="numeric" />
                        <button class="btn btn--ghost btn--small" type="button" id="seed-random">Würfeln</button>
                    </span>
                    <small>Gleicher Seed + gleiche Einstellungen = gleiches Heft.</small>
                </label>
            </fieldset>

            <fieldset class="group">
                <legend>PDF</legend>
                <label class="field field--wide">
                    <span>Titel</span>
                    <input type="text" name="title" id="field-title" maxlength="80" placeholder="Logik unter Hochdruck" />
                </label>
                <label class="field field--wide">
                    <span>Untertitel</span>
                    <input type="text" name="subtitle" id="field-subtitle" maxlength="120" placeholder="wird automatisch erzeugt" />
                </label>
                <label class="field">
                    <span>Farbschema</span>
                    <select id="field-palette"></select>
                </label>
                <label class="field">
                    <span>Akzentfarbe</span>
                    <input type="color" name="accent" id="field-accent" value="#C6492D" />
                </label>
                <label class="field">
                    <span>Zweitfarbe</span>
                    <input type="color" name="secondary" id="field-secondary" value="#227C78" />
                </label>
                <label class="field">
                    <span>Textfarbe</span>
                    <input type="color" name="ink" id="field-ink" value="#172033" />
                </label>
            </fieldset>

            <div class="actions">
                <button class="btn btn--primary btn--large" type="submit" id="generate-button">Rätsel erzeugen</button>
                <p class="hint" id="config-hint"></p>
            </div>
        </form>
    </section>

    <!-- 3. Ergebnis -->
    <section class="screen screen--result" id="screen-result">
        <header class="bar">
            <button class="btn btn--ghost" type="button" data-goto="screen-config">← Einstellungen</button>
            <h2 id="result-title">Heft</h2>
        </header>

        <div class="result-head">
            <p id="result-subtitle" class="result-sub"></p>
            <ul class="meta" id="result-meta"></ul>
            <div class="actions actions--row">
                <button class="btn btn--primary" type="button" id="pdf-button">PDF herunterladen</button>
                <button class="btn btn--ghost" type="button" id="reroll-button">Anderer Seed</button>
            </div>
            <p class="hint" id="result-hint"></p>
        </div>

        <div id="puzzle-list" class="puzzles"></div>
    </section>

    <!-- 4. Spielen -->
    <section class="screen screen--play" id="screen-play" data-view="pager">
        <header class="bar play-bar">
            <button class="btn btn--ghost btn--small" type="button" data-goto="screen-result" aria-label="Zurück zur Übersicht">← Übersicht</button>
            <h2 id="play-title">Rätsel</h2>
            <span class="timer" id="play-timer" aria-live="off" aria-label="Verstrichene Zeit">0:00</span>
        </header>

        <div class="play-toolbar">
            <button class="btn btn--primary btn--small" type="button" id="play-check">Prüfen</button>
            <button class="btn btn--ghost btn--small btn--icon" type="button" id="play-undo" disabled aria-label="Letzte Markierung zurücknehmen">↶</button>
            <button class="btn btn--ghost btn--small" type="button" id="play-pause">Pause</button>
            <button class="btn btn--ghost btn--small view-toggle" type="button" id="play-view">Gesamt</button>
            <button class="btn btn--ghost btn--small" type="button" id="play-clear">Löschen</button>
        </div>

        <div class="play-head">
            <p class="result-sub" id="play-story"></p>
            <p class="goal" id="play-goal"></p>
            <p class="hint" id="play-status" role="status" aria-live="polite"></p>
        </div>

        <div class="play-stage" id="play-stage">
            <div class="play-pager" id="play-pager">
                <div class="segmented" id="pager-nav" role="tablist" aria-label="Kategoriepaare"></div>
                <div class="pager-track" id="pager-track"></div>
            </div>

            <div class="play-overview" id="play-overview">
                <div class="zoom-controls">
                    <button class="btn btn--ghost btn--small btn--icon" type="button" id="zoom-out" aria-label="Verkleinern">−</button>
                    <output id="zoom-level" for="zoom-out zoom-in">100%</output>
                    <button class="btn btn--ghost btn--small btn--icon" type="button" id="zoom-in" aria-label="Vergrößern">+</button>
                </div>
                <div class="grid-scroll" id="grid-scroll">
                    <div class="grid-zoom" id="grid-zoom"></div>
                </div>
            </div>

            <aside class="clues-sheet" id="clues-sheet" data-detent="peek">
                <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
                <button class="sheet-header" type="button" id="sheet-toggle" aria-expanded="false" aria-controls="sheet-body">
                    <h3>Hinweise <span class="sheet-count" id="clue-count"></span></h3>
                    <span class="sheet-chevron" aria-hidden="true">▲</span>
                </button>
                <div class="sheet-body" id="sheet-body">
                    <ol class="clues" id="play-clue-list"></ol>
                    <details id="play-solution">
                        <summary>Lösung anzeigen</summary>
                        <div id="play-solution-table"></div>
                    </details>
                </div>
            </aside>
        </div>
        <div class="sheet-backdrop" id="sheet-backdrop"></div>

        <!-- Shared guard for the two toolbar actions a mis-tap must not trigger:
             "Prüfen" reveals wrong cells (a spoiler) and "Löschen" wipes every
             mark. Both sit between three other buttons. Title, body and the
             confirm label are filled in per action. -->
        <dialog class="confirm" id="confirm-dialog" aria-labelledby="confirm-title">
            <h3 class="confirm__title" id="confirm-title"></h3>
            <p class="confirm__text" id="confirm-text"></p>
            <form method="dialog" class="confirm__actions">
                <!-- autofocus sits on the safe action, so Enter dismisses. -->
                <button class="btn btn--ghost" type="submit" value="cancel" id="confirm-cancel" autofocus>Abbrechen</button>
                <button class="btn btn--primary" type="submit" value="ok" id="confirm-ok">Bestätigen</button>
            </form>
        </dialog>
    </section>

    <div class="overlay" id="overlay" hidden>
        <div class="spinner"></div>
        <p id="overlay-text">Rätsel werden erzeugt …</p>
    </div>
</main>

<!-- Pure play rules, shared verbatim with the Jest suite (test/PlayLogic.test.ts).
     Loaded as a classic script so it keeps its UMD wrapper and CommonJS export. -->
<script src="./playLogic.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
