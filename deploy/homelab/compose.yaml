# Copy to ~/docker/stacks/logicals/compose.yaml on the home server.
# The build context is the checkout that autodeploy.sh keeps up to date.
services:
  logicals:
    build:
      context: /home/jonas/docker/data/logicals/repo
      dockerfile: Dockerfile
    image: logicals:latest
    container_name: logicals
    restart: unless-stopped
    ports:
      - "3070:4173"
    environment:
      - TZ=Europe/Berlin
      # Parallel puzzle generations; each one can saturate a core for a few seconds.
      - LOGICALS_MAX_CONCURRENCY=2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4173/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2"
    networks:
      - proxy
    labels:
      - homepage.group=Applications
      - homepage.name=Logicals
      - homepage.icon=mdi-puzzle
      - homepage.href=http://logicals.home
      - homepage.description=German logic puzzle booklets as printable PDFs
      - homepage.siteMonitor=http://logicals:4173/healthz

networks:
  proxy:
    external: true
